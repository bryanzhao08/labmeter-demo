<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Parity: agentic lab management for shared research cores. You run the science. Parity runs the lab.">
  <meta name="theme-color" content="#e7e5de">
  <title>Parity</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:LabMono;src:url('fonts/RobotoMono-VF.woff2') format('woff2');font-weight:300 700;font-display:swap}
    :root{--bench:#e7e5de;--rule:#d9d6cc;--paper:#f6f5f0;--edge:#cbc8be;--ink:#22221f;--muted:#5d5b53;--yellow:#f4c430}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--ink);font-family:LabMono,ui-monospace,monospace;
      background:var(--bench) repeating-linear-gradient(transparent 0 59px,var(--rule) 59px 60px);
      display:grid;grid-template-rows:1fr auto;min-height:100vh}
    main{display:grid;place-items:center;padding:48px 16px;text-align:center}
    .mark{width:96px;height:96px;margin:0 auto 20px;display:block}
    h1{font-size:clamp(64px,13vw,150px);font-weight:700;letter-spacing:-.04em;line-height:1;margin:0}
    .slogan{display:inline-block;margin:28px 0 44px;padding:14px 22px;background:var(--paper);border:1px solid var(--edge);
      box-shadow:3px 3px 0 #bdb9ad;font-size:clamp(18px,2.6vw,26px);font-weight:500;transform:rotate(-.6deg)}
    .cta{display:inline-block;min-height:56px;padding:16px 30px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);
      border-radius:4px;font:700 18px LabMono,monospace;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
    .actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .cta.secondary{background:var(--paper)}
    .cta:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
    .cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
    .cta:focus-visible,a:focus-visible{outline:3px solid #456b97;outline-offset:5px}
    .sub{margin:18px 0 0;font-size:14px;color:var(--muted)}
    footer{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;padding:20px 16px 28px;font-size:13px;color:var(--muted)}
    footer a{color:var(--muted);text-underline-offset:4px}
    @media (prefers-reduced-motion:reduce){.cta{transition:none}}
  </style>
</head>
<body>
  <main>
    <div>
      <img class="mark" src="../brand/parity-mark-ink.svg" alt="" width="96" height="96">
      <h1>Parity</h1>
      <p class="slogan">You run the science. Parity runs the lab.</p>
      <div class="actions"><a class="cta" href="mailto:zhaobrya@usc.edu?subject=Parity%20early%20access&amp;body=Hi%20Bryan%2C%0A%0AI%27m%20interested%20in%20Parity%20for%20my%20lab%20or%20core.%0A%0ALab%20or%20university%3A%0AWhat%20I%27d%20like%20help%20with%3A%0A">Pre-order / work with me</a><a class="cta secondary" href="download.html">Download here</a></div>
      <p class="sub">Pre-order opens an email to Bryan. Download gets you the Mac app and setup steps.</p>
    </div>
  </main>
  <footer><a href="download.html">Download the preview</a><a href="https://github.com/bryanzhao08/parity/releases">GitHub releases</a><span>© 2026 Parity</span></footer>
</body>
</html>
