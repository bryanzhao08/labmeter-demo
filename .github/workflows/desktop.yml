name: Desktop builds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: desktop:mac
          - os: windows-latest
            command: desktop:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: LaBro-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.exe
